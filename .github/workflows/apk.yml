name: Build APK

# 서명 키 시크릿(ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD)을 저장소에 등록한 뒤 Actions 탭에서 수동으로 실행한다.
#   gh secret set ANDROID_KEYSTORE_B64 < <(base64 -w0 ~/.junyoung-voca/release.keystore)
#   gh secret set ANDROID_KEYSTORE_PASSWORD < ~/.junyoung-voca/keystore-password.txt
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run build:native
      - name: Restore keystore
        run: |
          mkdir -p ~/.junyoung-voca
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > ~/.junyoung-voca/release.keystore
      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: /home/runner/.junyoung-voca/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: junyoung
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain
      - run: cp android/app/build/outputs/apk/release/app-release.apk junyoung-voca.apk
      - uses: actions/upload-artifact@v4
        with:
          name: junyoung-voca-apk
          path: junyoung-voca.apk
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "준영보카 APK (최신)" --notes "main 브랜치의 최신 빌드"
          gh release upload latest junyoung-voca.apk --clobber
