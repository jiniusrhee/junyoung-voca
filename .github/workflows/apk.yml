name: Build APK

# 서명 키 시크릿(ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD)을 저장소에 등록한 뒤 Actions 탭에서 수동으로 실행한다.
# (평소 배포는 PC 에서 `npm run release:apk` 로 한다. 이 파일은 push 때는 돌지 않는다 — 문법이 틀리면 push 마다 "Run failed" 메일이 오므로 고친 뒤 꼭 확인할 것)
#   gh secret set ANDROID_KEYSTORE_B64 < <(base64 -w0 ~/.junyoung-voca/release.keystore)
#   gh secret set ANDROID_KEYSTORE_PASSWORD < ~/.junyoung-voca/keystore-password.txt
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run build:native
      - name: Restore keystore
        run: |
          mkdir -p ~/.junyoung-voca
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > ~/.junyoung-voca/release.keystore
      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: /home/runner/.junyoung-voca/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: junyoung
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain
      - run: cp android/app/build/outputs/apk/release/app-release.apk junyoung-voca.apk
      - uses: actions/upload-artifact@v4
        with:
          name: junyoung-voca-apk
          path: junyoung-voca.apk
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "준영보카 APK (최신)" --notes "main 브랜치의 최신 빌드"
          gh release upload latest junyoung-voca.apk --clobber
          V=$(node -p "require('./package.json').version")
          CODE=$(node -p "const [a=0,b=0,c=0]=require('./package.json').version.split('.').map(Number); a*10000+b*100+c")
          # 줄바꿈은 printf 의 %s 뒤 \n 으로 (여러 줄 문자열을 그대로 쓰면 들여쓰기가 깨져 이 파일 전체가 잘못된 YAML 이 된다)
          BODY=$(printf 'version=%s\nversionCode=%s\n%s 빌드 (CI)' "$V" "$CODE" "$(date +%F)")
          gh release edit latest --title "준영보카 APK v$V" --notes "$BODY"
